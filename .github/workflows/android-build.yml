name: Android Build & PR Validation

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "ci/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.1"

      - name: Build release
        run: gradle --no-daemon :app:assembleRelease

      - name: Build debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon test

      - name: Upload release APK
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: guise-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
